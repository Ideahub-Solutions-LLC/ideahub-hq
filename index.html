<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ideahub HQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one open-plan office floor seen from above (warm wood floor, glass meeting rooms, desk rows, cafe and play area); floating HUD top-left, room inspector right (bottom sheet on phones), activity bottom-left. Single warm look by choice. */
:root{
  --ground:#D9DCE1;
  --ink:#2B2622;
  --muted:#7A6E63;
  --card:#FFFFFF;
  --card-2:#F7F2EC;
  --line:#EBE2D7;
  --accent:#3B82F6;
  --go:#22A060;
  --wait:#E8890C;
  --stop:#D6336C;
  --body:'Nunito','Segoe UI',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--body);overflow:hidden;font-size:14px}
#stage{position:fixed;inset:0}
#stage canvas{display:block;outline:none;touch-action:none}
.card{background:var(--card);border-radius:16px;box-shadow:0 1px 2px rgba(43,38,34,.08),0 8px 24px rgba(43,38,34,.12)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,.tag:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

#hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px;max-width:min(420px,calc(100vw - 32px));z-index:5}
#brand{padding:12px 16px;display:flex;flex-direction:column;gap:8px}
#brand h1{font-weight:900;font-size:20px;letter-spacing:.12em;text-transform:uppercase;line-height:1;margin:0}
#brand .sub{margin:0;color:var(--muted);font-weight:700;font-size:13px}
#meRow{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px;flex-wrap:wrap}
#meRow img{width:24px;height:24px;border-radius:50%}
.role{font-size:10.5px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--card-2);color:var(--muted)}
.role.host{background:#FFE8B8;color:#7A4B00}
#switcher{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative;display:flex;align-items:center;gap:8px;padding:7px 12px;border:0;border-radius:999px;background:var(--card);font-weight:900;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;box-shadow:0 1px 2px rgba(43,38,34,.1),0 4px 12px rgba(43,38,34,.1)}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff}
.chip .n{font-variant-numeric:tabular-nums;opacity:.6}
.chip .knock{position:absolute;top:-7px;right:-5px;min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:var(--wait);color:#fff;font-size:10.5px;letter-spacing:0;display:grid;place-items:center;box-shadow:0 0 0 2px #fff}
.dot{width:9px;height:9px;border-radius:50%;flex:none}

#panel{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 16px);width:360px;overflow-y:auto;z-index:5;display:flex;flex-direction:column}
#panel header{padding:16px 16px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px;position:sticky;top:0;background:var(--card);border-radius:16px 16px 0 0;z-index:1}
#panel h2{font-weight:900;font-size:22px;margin:0;line-height:1.1;text-wrap:balance}
.live{align-self:flex-start;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px;background:var(--card-2);color:var(--muted)}
.live.on{background:#DDF5E6;color:#166B3E}
.live i{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.6}
.live.on i{background:var(--go);opacity:1;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.35}}
.sect{padding:12px 16px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.sect:last-child{border-bottom:0}
.label{font-size:10.5px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.sect p{margin:0;line-height:1.5}
.hint{font-size:12px;color:var(--muted);line-height:1.45}
.big{display:flex;align-items:center;justify-content:center;gap:8px;padding:11px 14px;border:0;border-radius:12px;background:var(--ink);color:#fff;font-weight:900;font-size:15px;text-decoration:none;text-align:center}
.big.go{background:var(--go)}
.big.ghost{background:var(--card-2);color:var(--ink)}
.big:disabled{opacity:.45;cursor:default}
.status{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:12px;background:var(--card-2);line-height:1.4}
.status.wait{background:#FFF1DC}
.status.ok{background:#DDF5E6}
.status.no{background:#FCE4EC}
.row2{display:flex;gap:8px;flex-wrap:wrap}
.row2>*{flex:1 1 140px}
.people{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.person{display:flex;align-items:center;gap:10px;min-width:0}
.person img{width:30px;height:30px;border-radius:50%;flex:none;background:var(--card-2)}
.person .who{flex:1;min-width:0;display:flex;flex-direction:column}
.person .nm{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.person .meta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.you{font-size:9.5px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;background:var(--accent);color:#fff;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:1px}
.online{width:8px;height:8px;border-radius:50%;background:var(--go);display:inline-block;margin-left:6px}
.mini{padding:5px 10px;border:0;border-radius:8px;background:var(--card-2);font-weight:800;font-size:12px;flex:none}
.mini.yes{background:var(--go);color:#fff}
.mini:disabled{opacity:.45;cursor:default}
.empty{font-size:13px;color:var(--muted);font-style:italic}
.field{display:flex;gap:8px}
.field input{flex:1;min-width:0;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;font-family:var(--mono);font-size:12px;background:var(--card)}
.err{font-size:12px;color:var(--stop);font-weight:700}
.banner{margin:12px 16px 0;padding:8px 12px;border-radius:10px;background:#FFF1DC;font-size:12.5px;line-height:1.4}

#dock{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 16px);width:min(400px,calc(100vw - 420px));height:min(360px,46vh);z-index:4;display:flex;flex-direction:column;overflow:hidden}
#dock.min{height:auto}
#dock.min .dock-body{display:none!important}
.dock-head{display:flex;align-items:center;gap:4px;padding:8px 10px;border-bottom:1px solid var(--line);flex:none}
.tab{border:0;background:none;padding:5px 10px;border-radius:8px;font-weight:900;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--card-2);color:var(--ink)}
.badge{display:inline-grid;place-items:center;min-width:17px;height:17px;padding:0 5px;border-radius:999px;background:var(--stop);color:#fff;font-size:10px;letter-spacing:0;margin-left:6px;vertical-align:1px}
.dock-head .sp{flex:1}
.iconbtn{border:0;background:var(--card-2);border-radius:8px;min-width:28px;height:28px;font-weight:900;color:var(--muted)}
.dock-body{flex:1;min-height:0;display:flex;flex-direction:column}
.threads{display:flex;gap:6px;padding:8px 10px;overflow-x:auto;border-bottom:1px solid var(--line);flex:none}
.thread{flex:none;display:flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:4px 10px 4px 4px;background:var(--card-2);font-weight:800;font-size:12px;white-space:nowrap;max-width:160px}
.thread span.nm{overflow:hidden;text-overflow:ellipsis}
.thread.gen{padding-left:10px}
.thread img{width:20px;height:20px;border-radius:50%;flex:none}
.thread[aria-selected="true"]{background:var(--ink);color:#fff}
.thread .udot{width:7px;height:7px;border-radius:50%;background:var(--stop);flex:none}
#msgs{list-style:none;margin:0;padding:10px;flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.msg{display:flex;gap:8px;min-width:0}
.msg img{width:26px;height:26px;border-radius:50%;flex:none;cursor:pointer}
.msg .bd{min-width:0;display:flex;flex-direction:column;gap:1px}
.msg .mh{font-size:12px;font-weight:800}
.msg .mh time{font-weight:600;color:var(--muted);margin-left:6px;font-variant-numeric:tabular-nums}
.msg .tx{font-size:13.5px;line-height:1.4;overflow-wrap:anywhere;white-space:pre-wrap}
.msg.mine .mh{color:var(--accent)}
#chatForm{display:flex;gap:6px;padding:8px 10px;border-top:1px solid var(--line);flex:none}
#chatInput{flex:1;min-width:0;padding:9px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--card)}
#chatForm button{border:0;border-radius:10px;background:var(--ink);color:#fff;font-weight:900;padding:0 14px}
#feedPane{overflow-y:auto;padding:8px 14px}
#feedPane ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
#feedPane li{font-size:12.5px;line-height:1.35;display:flex;gap:8px}
#feedPane time{font-family:var(--mono);font-size:11px;color:var(--muted);flex:none;padding-top:1px;font-variant-numeric:tabular-nums}

/* zone pills on the floor */
.tag{position:fixed;left:0;top:0;padding:6px 12px;border:0;border-radius:999px;background:var(--card);font-weight:900;font-size:12px;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;display:flex;align-items:center;gap:8px;box-shadow:0 1px 2px rgba(43,38,34,.12),0 3px 10px rgba(43,38,34,.12);z-index:3;will-change:transform}
.tag .n{font-variant-numeric:tabular-nums;color:var(--muted)}
.tag .w{background:var(--wait);color:#fff;border-radius:999px;padding:1px 7px;font-size:10px;letter-spacing:.04em}
.tag.zone{cursor:default}
.tag.sel{background:var(--ink);color:#fff}
.tag.sel .n{color:#fff;opacity:.7}
.ptag{position:fixed;left:0;top:0;padding:2px 8px;border:0;border-radius:8px;background:rgba(255,255,255,.95);color:var(--ink);font-family:var(--body);font-weight:800;font-size:11px;white-space:nowrap;z-index:2;pointer-events:auto;cursor:pointer;max-width:130px;overflow:hidden;text-overflow:ellipsis;box-shadow:0 2px 6px rgba(43,38,34,.18);will-change:transform}
.ptag.wait{background:var(--wait);color:#fff}
.ptag.me{background:var(--accent);color:#fff}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;z-index:9;max-width:calc(100vw - 32px)}

#hint[hidden],#cross[hidden],#pad[hidden]{display:none}
.walkbtn{align-self:flex-start;display:flex;align-items:center;justify-content:center;gap:10px;padding:10px 14px;border:0;border-radius:12px;background:var(--ink);color:#fff;font-weight:900;font-size:14px;box-shadow:0 4px 12px rgba(43,38,34,.2)}
.walkbtn kbd{font-family:var(--mono);font-size:11px;background:rgba(255,255,255,.18);border-radius:5px;padding:1px 6px}
#hint{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateX(-50%);background:rgba(43,38,34,.9);color:#fff;padding:10px 16px;border-radius:12px;font-weight:800;font-size:13px;z-index:6;max-width:min(560px,calc(100vw - 32px));text-align:center;line-height:1.4}
#hint kbd{font-family:var(--mono);font-size:11px;background:rgba(255,255,255,.2);border-radius:5px;padding:1px 6px}
#cross{position:fixed;left:50%;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px rgba(43,38,34,.6);z-index:4;pointer-events:none}
#pad{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 80px);display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(2,54px);gap:6px;z-index:6;touch-action:none}
#pad button{border:0;border-radius:12px;background:rgba(255,255,255,.92);font-weight:900;font-size:16px;box-shadow:0 2px 8px rgba(43,38,34,.2);touch-action:none;user-select:none}
#pad .kn{background:var(--wait);color:#fff;font-size:12px}
body.fp #toast{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 16px)}
body.fp .ptag{font-size:12px}
@media (max-width:760px){
  body.fp #panel{display:none}
  #brand .sub{display:none}
  .chip{padding:6px 10px;font-size:10.5px}
  #panel{top:auto;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));width:auto;max-height:46vh;bottom:calc(env(safe-area-inset-bottom,0px) + 12px)}
  #dock{display:none}
  body.chat #dock{display:flex;left:12px;right:12px;width:auto;height:58vh;bottom:calc(env(safe-area-inset-bottom,0px) + 12px)}
  body.chat #panel{display:none}
  #chatBtn{display:flex}
  .tag{font-size:10px;padding:4px 9px}
  .ptag{font-size:10px}
}
@media (prefers-reduced-motion:reduce){.live.on i{animation:none}}
[hidden]{display:none!important}
.hudrow{display:flex;gap:8px;flex-wrap:wrap}
#chatBtn{display:none}
#pcard{position:fixed;z-index:12;width:270px;padding:16px;display:flex;flex-direction:column;gap:12px}
#pcard .ph{display:flex;align-items:center;gap:10px;padding-right:20px}
#pcard .ph img{width:42px;height:42px;border-radius:50%;flex:none}
#pcard .ph b{display:block;font-size:15px;line-height:1.2}
#pcard .ph span{font-size:12px;color:var(--muted);line-height:1.35}
#pcard .x{position:absolute;top:8px;right:10px;border:0;background:none;font-size:20px;line-height:1;color:var(--muted);padding:4px}
.pact{display:flex;flex-direction:column;gap:6px}
.pact>button{display:flex;align-items:center;gap:10px;border:0;border-radius:10px;padding:10px 12px;background:var(--card-2);font-weight:800;font-size:13px;text-align:left}
.pact>button.pri{background:var(--go);color:#fff}
.pact>button:disabled{opacity:.5;cursor:default}
.pact .ic{width:18px;text-align:center;flex:none}
.roompick{display:flex;flex-wrap:wrap;gap:6px;padding:2px 0 4px}
.roompick button{border:0;border-radius:999px;padding:6px 10px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line);font-weight:800;font-size:12px;display:flex;align-items:center;gap:6px}
#invites{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:50%;transform:translateX(-50%);z-index:11;display:flex;flex-direction:column;gap:8px;width:min(380px,calc(100vw - 32px));pointer-events:none}
.invite{padding:12px 14px;display:flex;align-items:center;gap:10px;pointer-events:auto}
.invite img{width:34px;height:34px;border-radius:50%;flex:none}
.invite .t{flex:1;min-width:0;font-size:13px;line-height:1.35}
.invite .bt{display:flex;flex-direction:column;gap:6px;flex:none}
body{margin:0}
#gate{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(217,220,225,.72);backdrop-filter:blur(6px);padding:16px}
#gate .card{width:min(400px,100%);padding:24px;display:flex;flex-direction:column;gap:12px;text-align:center}
#gate h2{margin:0;font-weight:900;font-size:22px;letter-spacing:.1em;text-transform:uppercase}
#gate p{margin:0;color:var(--muted);line-height:1.5}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;padding:12px 16px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font-weight:800;font-size:15px}
.gbtn svg{width:18px;height:18px}
.linkbtn{border:0;background:none;color:var(--muted);font-weight:700;text-decoration:underline;font-size:12px;padding:0}
</style>
</head>
<body>

<div id="stage" aria-label="Top-down view of the Ideahub office floor. People in a meeting sit in that room; people waiting to be let in stand outside its door; everyone else online sits in the open workspace."></div>

<div id="hud">
  <div id="brand" class="card">
    <h1>Ideahub HQ</h1>
    <p class="sub">Pick a room, ask to join, and a host lets you in.</p>
    <div id="meRow"><span class="hint">Connecting…</span></div>
  </div>
  <div id="switcher" role="toolbar" aria-label="Rooms"></div>
  <div class="hudrow">
    <button class="walkbtn" id="walk">Walk around <kbd>V</kbd></button>
    <button class="walkbtn" id="chatBtn">Chat <span class="badge" id="chatBtnBadge" hidden></span></button>
  </div>
</div>
<div id="hint" hidden></div>
<div id="cross" hidden></div>
<div id="pad" hidden aria-label="Movement controls">
  <span></span><button data-k="w" aria-label="Forward">▲</button><button class="kn" data-k="e" aria-label="Ask to join">Knock</button>
  <button data-k="a" aria-label="Left">◀</button><button data-k="s" aria-label="Backward">▼</button><button data-k="d" aria-label="Right">▶</button>
</div>

<aside id="panel" class="card" aria-live="polite"></aside>

<section id="dock" class="card" aria-label="Chat and activity">
  <div class="dock-head" role="tablist">
    <button class="tab" id="tabChat" role="tab" aria-selected="true">Chat<span class="badge" id="chatBadge" hidden></span></button>
    <button class="tab" id="tabFeed" role="tab" aria-selected="false">Activity</button>
    <span class="sp"></span>
    <button class="iconbtn" id="dockMin" aria-label="Minimize chat">–</button>
  </div>
  <div class="dock-body" id="chatPane">
    <div class="threads" id="threads"></div>
    <ol id="msgs" aria-live="polite"></ol>
    <form id="chatForm" autocomplete="off"><input id="chatInput" maxlength="1000" placeholder="Message everyone" aria-label="Message"><button type="submit">Send</button></form>
  </div>
  <div class="dock-body" id="feedPane" hidden><ol id="feedList"></ol></div>
</section>
<div id="invites" aria-live="polite"></div>
<div id="pcard" class="card" hidden role="dialog" aria-label="Person"></div>
<div id="toast" hidden></div>
<div id="gate" hidden>
  <div class="card">
    <h2>Ideahub HQ</h2>
    <p id="gateMsg">Sign in with your Google account to enter the office.</p>
    <button class="gbtn" id="gateBtn"><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg><span>Sign in with Google</span></button>
    <button class="linkbtn" id="gateAlt" hidden>Use a different account</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { getDatabase, ref, onValue, get, set, update, remove, onDisconnect, serverTimestamp, push, query, limitToLast } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';
import { FIREBASE_CONFIG } from './firebase-config.js';

(() => {
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const MEET_RE = /^https:\/\/meet\.google\.com\/[a-z0-9-]+(\?.*)?$/i;

/* ---------------- floor plan ----------------
   x runs -30..30 (left→right), z runs -17..16 (back wall → front edge) */
const ROOMS = {
  creative:{name:'Room 1', color:'#E8508A', blurb:'Six-desk room for working sessions, pairing and walkthroughs.',

const people = new Map();
function syncScene(ps){
  const want = new Map();
  MEETING_IDS.forEach(id=>{
    occupantsOf(id).forEach((uid,i)=> want.set(uid,{...meetingSeat(id,i), state:'in'}));
    waitingFor(id).forEach((uid,i)=>{ if(!want.has(uid)) want.set(uid,{...queueSeat(id,i), state:'wait'}); });
  });
  let k = 0;
  [...S.online].sort().forEach(uid=>{ if(!want.has(uid)) want.set(uid,{...idleSeat(k++), state:'idle'}); });
  for(const [uid,p] of people){ if(!want.has(uid)){ scene.remove(p.g); p.tag.remove(); people.delete(uid); } }
  for(const [uid,w] of want){
    const prof = ps[uid] || {};
    let p = people.get(uid);
    if(!p){
      const g = person(uid, prof.color || '#8A94A6'); g.position.copy(SPAWN); scene.add(g);
      g.userData.uid = uid;
      const tag = document.createElement('button'); tag.className = 'ptag'; document.body.appendChild(tag);
      tag.addEventListener('click', e=>{ e.stopPropagation(); openPerson(uid, e.clientX, e.clientY); });
      p = {g, tag, path:[], key:''}; people.set(uid,p);
    }
    p.walk = S.walkers.get(uid) || null;
    const key = `${w.x.toFixed(2)},${w.z.toFixed(2)}`;
    if(!p.walk && key !== p.key){ p.key = key; p.path = route(p.g.position, new THREE.Vector3(w.x,0,w.z)); }
    p.rot = w.rot; p.sit = w.sit; p.state = w.state;
    const me = uid===S.me.id;
    p.tag.textContent = (prof.name || 'Someone') + (me ? ' (you)' : '');
    p.tag.className = 'ptag' + (w.state==='wait' ? ' wait' : me ? ' me' : '');
    const ring = p.g.userData.ring;
    ring.visible = w.state!=='idle' || me;
    ring.material.color.set(w.state==='wait' ? '#E8890C' : w.state==='in' ? '#22A060' : '#3B82F6');

function h(tag, attrs, ...kids){
  const e = document.createElement(tag);
  for(const k in (attrs||{})){
    const v = attrs[k];
    if(v==null || v===false) continue;
    if(k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if(k==='class') e.className = v;
    else e.setAttribute(k, v===true?'':v);
  }
  kids.flat().forEach(c=>{ if(c==null||c===false) return; e.append(c.nodeType?c:document.createTextNode(String(c))); });
  return e;
}

/* Meet opens in a window docked to the right side of the screen.
   Google doesn't allow Meet inside other websites, so a docked window is the closest fit. */
let meetWin = null, meetRoom = null, meetWatch = null;
function openMeet(url, id, quiet){
  if(!/^https:\/\/meet\.google\.com\//.test(url||'')) { toast('This room’s Meet link looks wrong. Ask a host to fix it.'); return null; }
  if(document.pointerLockElement && document.exitPointerLock) document.exitPointerLock();
  if(meetWin && !meetWin.closed && meetRoom===id){ try{ meetWin.focus(); }catch(e){} return meetWin; }
  const sw = screen.availWidth || innerWidth, sh = screen.availHeight || innerHeight;
  const sl = (screen.availLeft ?? 0), st = (screen.availTop ?? 0);
  const w = Math.round(Math.min(960, Math.max(480, sw*0.42))), ht = Math.round(sh);
  const feats = `popup=yes,width=${w},height=${ht},left=${Math.round(sl + sw - w)},top=${Math.round(st)}`;
  const win = window.open(url, 'ideahub-meet', feats);
  if(!win){ if(!quiet) toast('Your browser blocked the call window. Allow pop-ups for this site, then try again.'); return null; }
  meetWin = win; meetRoom = id;
  try{ win.focus(); }catch(e){}
  feed(`Opened the ${ROOMS[id].name} call beside the office.`);
  clearInterval(meetWatch);
  meetWatch = setInterval(()=>{
    if(meetWin && meetWin.closed){
      clearInterval(meetWatch); meetWin = null;
      const o = S.occ[S.me.id];
      if(API && o && o.room===meetRoom){ act(()=>API.leave(S.me.id), `You left ${ROOMS[meetRoom].name} (call window closed)`); }
      meetRoom = null; render();
    }
  }, 1500);
  render();
  return win;
}
function closeCall(){ try{ if(meetWin && !meetWin.closed) meetWin.close(); }catch(e){} meetWin = null; meetRoom = null; clearInterval(meetWatch); }
function myLink(id){ return S.me.host ? meetFor(id) : (S.grant && S.grant.room===id && S.grant.decision==='approved' ? S.grant.meet : ''); }
function shareScreen(id){
  const link = myLink(id);
  if(!(meetWin && !meetWin.closed && meetRoom===id)){ if(!link || !openMeet(link, id)) return; }
  else { try{ meetWin.focus(); }catch(e){} }
  toast('In the call window, click “Share screen” (the screen icon in the bottom bar) and pick what to show.');
}

  const meet = meetFor(id); if(!meet) return;
  await act(()=>API.decide(uid,{room:id, meet, decision:'approved', at:Date.now(), by:S.me.id}), 'Let in. They can open the meeting now.');

function blocked(x,z){

}
function needLive(what){ if(S.mode==='live') return true; toast(`Sign in to ${what}.`); return false; }
function jumpTo(uid){
  const o = S.occ[uid]; if(!o || !ROOMS[o.room]) return;
  const R = o.room;
  closePerson();
  if(FP.on){ const d = doorPts(R).outside; FP.x = d.x; FP.z = d.z; FP.yaw = ROOMS[R].inward < 0 ? 0 : Math.PI; FP.free = true; }
  else select(R, true);
  if(!needLive('join meetings')) return;
  if(canEnter(R)){
    const link = S.me.host ? meetFor(R) : (S.grant && S.grant.room===R && S.grant.meet);
    if(!link){ toast(`${ROOMS[R].name} has no Meet link yet. Ask a host to add it.`); return; }
    openMeet(link, R); enter(R);
  } else {
    if(S.readOnly || !S.me.canWrite){ toast('Your account can’t join yet. Ask an office admin.'); return; }
    act(()=>API.ask(R), `Asked to join ${ROOMS[R].name}. A host will let you in.`);
  }
}
function inviteTo(uid, room){
  if(!needLive('invite people')) return;
  const nm = profileOf(uid).name || 'them';
  act(()=>API.invite(uid, room), `Invited ${nm} to ${ROOMS[room].name}.`);
  PC.pick = false; closePerson();
}

/* ---------------- invites I received ---------------- */
let INVITES = {};
function renderInvites(){
  const box = document.getElementById('invites'); box.textContent = '';
  const now = Date.now();
  Object.entries(INVITES).filter(([,v])=>v && ROOMS[v.room] && now - v.at < 2*3600e3).sort((a,b)=>b[1].at-a[1].at).slice(0,3).forEach(([from,v])=>{
    const p = profileOf(from), R = v.room, nm = ROOMS[R].name;
    const mine = S.occ[S.me.id]; if(mine && mine.room===R) { API && API.dismissInvite(from); return; }
    const can = canEnter(R);
    box.append(h('div',{class:'card invite'}, h('img',{src:p.avatarUrl,alt:''}),
      h('div',{class:'t'}, h('b',null,p.name||'Someone'), ` invited you to ${nm}.`),
      h('div',{class:'bt'},
        h('button',{class:'mini yes',onclick:()=>{
          API.dismissInvite(from);
          if(can){ const link = S.me.host ? meetFor(R) : (S.grant && S.grant.room===R && S.grant.meet); if(link){ openMeet(link,R); enter(R); select(R,!FP.on); } else toast(`${nm} has no Meet link yet.`); }
          else act(()=>API.ask(R), `Asked to join ${nm}. A host will let you in.`);
        }}, can ? 'Join' : 'Ask to join'),
        h('button',{class:'mini',onclick:()=>API.dismissInvite(from)},'Not now'))));
  });
}

/* ---------------- chat ---------------- */
const CHAT = {thread:'general', general:[], dm:{}, index:{}, dmUnsub:null, tab:'chat', stick:true};
const readKey = t => 'ihq-read-' + (S.me.id||'x') + '-' + t;
function lastRead(t){ try{ return +localStorage.getItem(readKey(t)) || 0; }catch(e){ return 0; } }
function markRead(t){ try{ localStorage.setItem(readKey(t), String(Date.now())); }catch(e){} }
const dockEl = document.getElementById('dock');
function chatVisible(){ return CHAT.tab==='chat' && !dockEl.classList.contains('min') && (innerWidth >= 760 || document.body.classList.contains('chat')); }
function unreadGeneral(){ const r = lastRead('general'); return CHAT.general.filter(m=>m.at > r && m.from !== S.me.id).length; }
function unreadDMs(){ return Object.entries(CHAT.index).filter(([o,v])=>v && v.from !== S.me.id && v.at > lastRead('dm:'+o)).map(([o])=>o); }
function renderThreads(){
  const box = document.getElementById('threads'); if(!box) return;
  if(chatVisible()) markRead(CHAT.thread);
  box.textContent = '';
  const ug = unreadGeneral(), udm = unreadDMs();
  box.append(h('button',{class:'thread gen','aria-selected':String(CHAT.thread==='general'),onclick:()=>openChat('general')}, h('span',{class:'nm'},'# General'), ug && CHAT.thread!=='general' ? h('span',{class:'udot'}) : null));
  const others = Object.entries(CHAT.index).sort((a,b)=>(b[1].at||0)-(a[1].at||0)).map(([o])=>o);
  if(CHAT.thread.startsWith('dm:') && !others.includes(CHAT.thread.slice(3))) others.unshift(CHAT.thread.slice(3));
  others.slice(0,20).forEach(o=>{
    const p = profileOf(o), t = 'dm:'+o;
    box.append(h('button',{class:'thread','aria-selected':String(CHAT.thread===t),onclick:()=>openChat(t)}, h('img',{src:p.avatarUrl,alt:''}), h('span',{class:'nm'},p.name||'Someone'), udm.includes(o) && CHAT.thread!==t ? h('span',{class:'udot'}) : null));
  });
  const total = (CHAT.thread==='general' && chatVisible() ? 0 : ug) + udm.filter(o=>!(CHAT.thread==='dm:'+o && chatVisible())).length;
  [document.getElementById('chatBadge'), document.getElementById('chatBtnBadge')].forEach(b=>{ b.hidden = !total; b.textContent = total > 99 ? '99+' : total; });
  renderMsgs();
}
function renderMsgs(){
  const list = document.getElementById('msgs'); if(!list) return;
  const atBottom = list.scrollHeight - list.scrollTop - list.clientHeight < 40;
  const msgs = CHAT.thread==='general' ? CHAT.general : (CHAT.dm[CHAT.thread] || []);
  list.textContent = '';
  if(!msgs.length){
    const other = CHAT.thread.startsWith('dm:') ? (profileOf(CHAT.thread.slice(3)).name || 'them') : null;
    list.append(h('li',{class:'empty'}, other ? `No messages with ${other} yet.` : 'No messages yet. Say hello to the office.'));
  }
  msgs.forEach(m=>{
    const p = profileOf(m.from), mine = m.from===S.me.id;
    list.append(h('li',{class:'msg'+(mine?' mine':'')},
      h('img',{src:p.avatarUrl,alt:'',onclick:e=>openPerson(m.from, e.clientX, e.clientY)}),
      h('div',{class:'bd'}, h('span',{class:'mh'}, mine ? 'You' : (p.name||'Someone'), h('time',null,fmtTime(m.at))), h('span',{class:'tx'}, m.text))));
  });
  if(atBottom || CHAT.stick){ list.scrollTop = list.scrollHeight; CHAT.stick = false; }
  const input = document.getElementById('chatInput');
  input.placeholder = CHAT.thread==='general' ? 'Message everyone' : `Message ${profileOf(CHAT.thread.slice(3)).name || 'them'}`;
}
function openChat(t){
  if(t.startsWith('dm:') && t.slice(3)===S.me.id) return;
  CHAT.thread = t; CHAT.tab = 'chat'; CHAT.stick = true;
  dockEl.classList.remove('min'); document.body.classList.add('chat');
  setTab('chat');
  if(S.mode==='live' && API) API.watchDM(t);
  renderThreads();
  setTimeout(()=>document.getElementById('chatInput').focus(), 0);
}
function setTab(tab){
  CHAT.tab = tab;
  document.getElementById('tabChat').setAttribute('aria-selected', String(tab==='chat'));
  document.getElementById('tabFeed').setAttribute('aria-selected', String(tab==='feed'));
  document.getElementById('chatPane').hidden = tab!=='chat';
  document.getElementById('feedPane').hidden = tab!=='feed';
  renderThreads();
}
document.getElementById('tabChat').addEventListener('click', ()=>{ dockEl.classList.remove('min'); setTab('chat'); });
document.getElementById('tabFeed').addEventListener('click', ()=>{ dockEl.classList.remove('min'); setTab('feed'); });
document.getElementById('dockMin').addEventListener('click', ()=>{
  const min = dockEl.classList.toggle('min');
  document.getElementById('dockMin').textContent = min ? '+' : '–';
  if(!min) CHAT.stick = true;
  document.body.classList.remove('chat'); renderThreads();
});
document.getElementById('chatBtn').addEventListener('click', ()=>{
  const on = document.body.classList.toggle('chat');
  if(on){ dockEl.classList.remove('min'); setTab('chat'); CHAT.stick = true; renderThreads(); }
});
document.getElementById('chatForm').addEventListener('submit', e=>{
  e.preventDefault();
  const input = document.getElementById('chatInput'), text = input.value.trim().slice(0,1000);
  if(!text) return;
  if(!needLive('chat')) return;
  if(S.readOnly || !S.me.canWrite){ toast('Your account can’t send messages yet.'); return; }
  input.value = ''; CHAT.stick = true;
  API.chat(CHAT.thread, text).catch(err=>{ input.value = text; toast(/permission/i.test(String(err&&err.message)) ? 'You don’t have permission to send that.' : 'Message didn’t send. Try again.'); });
});
document.getElementById('chatInput').addEventListener('keydown', e=>{ if(e.key==='Escape') e.target.blur(); });

/* ---------------- preview data (only without live data) ---------------- */
function initials(ch,color){
  const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d');
  g.fillStyle = color; g.fillRect(0,0,64,64); g.fillStyle = '#fff'; g.font = 'bold 30px sans-serif'; g.textAlign='center'; g.textBaseline='middle'; g.fillText(ch,32,34);
  return c.toDataURL();
}
function startPreview(){
  S.mode = 'preview'; S.me = {id:null, name:'', avatar:'', color:'#888', host:false, canWrite:true}; S.grant = null; S.walkers = new Map();
  const now = Date.now(), m = 60000;
  const names = [['p1','Ana','#7950F2'],['p2','Ben','#12B886'],['p3','Carla','#FD7E14'],['p4','Dev','#228BE6'],['p5','Elle','#E64980'],['p6','Fil','#F59F00'],['p7','Gia','#15AABF'],['p8','Hugo','#5C7CFA'],['p9','Ivy','#40C057']];
  const P = {}; names.forEach(([id,n,c])=>P[id] = {name:n+' (sample)', color:c, avatarUrl:initials(n[0],c)});
  profilesCache = P;
  S.occ = {p1:{room:'viktor',since:now-22*m}, p2:{room:'viktor',since:now-9*m}, p3:{room:'creative',since:now-30*m}, p5:{room:'lobby',since:now-4*m}, p9:{room:'creative',since:now-6*m}, p7:{room:'room3',since:now-12*m}};
  S.requests = {p4:{room:'viktor',at:now-1*m}};
  S.online = new Set(['p1','p2','p3','p4','p5','p6','p7','p8','p9']);
  CHAT.general = [{from:'p2',text:'Morning! Room 2 standup in 5.',at:now-14*m},{from:'p3',text:'Design review moved to Room 1 today.',at:now-9*m},{from:'p7',text:'I’m in Room 3 if anyone needs me.',at:now-3*m}];
  CHAT.index = {}; CHAT.dm = {}; CHAT.thread = 'general'; INVITES = {};
  feed('Preview: sample people are shown until you sign in.');
  render();
}

/* ---------------- live wiring (Firebase) ---------------- */
const CONFIG_OK = !!(FIREBASE_CONFIG && FIREBASE_CONFIG.apiKey && !/PASTE|YOUR_/i.test(FIREBASE_CONFIG.apiKey) && FIREBASE_CONFIG.databaseURL);
const emailKey = e => String(e||'').toLowerCase().replace(/\./g, ',');
const COLORS = ['#7950F2','#12B886','#FD7E14','#228BE6','#E64980','#F59F00','#15AABF','#5C7CFA','#40C057','#FA5252'];
const colorFor = uid => COLORS[hash(uid)%COLORS.length];
S.profiles = {};
function liveProfiles(ids){
  const out = {};
  ids.forEach(uid=>{
    const p = S.profiles[uid] || (uid===S.me.id ? {name:S.me.name, photo:S.me.avatar, color:S.me.color} : {});
    const name = typeof p.name==='string' ? p.name.slice(0,80) : '';
    const color = /^#[0-9a-f]{6}$/i.test(p.color||'') ? p.color : colorFor(uid);
    const photo = typeof p.photo==='string' && /^https:\/\//.test(p.photo) ? p.photo : '';
    out[uid] = {name, color, avatarUrl: photo || initials((name||'?')[0].toUpperCase(), color)};
  });
  return out;
}
function diffKeys(prev, next){ return {added:Object.keys(next).filter(k=>!(k in prev)), removed:Object.keys(prev).filter(k=>!(k in next))}; }
const gate = {el:document.getElementById('gate'), msg:document.getElementById('gateMsg'), btn:document.getElementById('gateBtn'), alt:document.getElementById('gateAlt')};
function showGate(msg, alt){ gate.msg.textContent = msg; gate.alt.hidden = !alt; gate.el.hidden = false; }

async function boot(){
  render(); frame();
  if(!CONFIG_OK){
    startPreview();
    feed('Add your Firebase settings to firebase-config.js to go live.');
    return;
  }
  const app = initializeApp(FIREBASE_CONFIG);
  const auth = getAuth(app), rdb = getDatabase(app);
  const provider = new GoogleAuthProvider(); provider.setCustomParameters({prompt:'select_account'});
  gate.btn.addEventListener('click', async ()=>{
    try{ await signInWithPopup(auth, provider); }
    catch(e){ if(e && /popup/i.test(e.code||'')) signInWithRedirect(auth, provider); else toast('Sign-in didn’t finish. Try again.'); }
  });
  gate.alt.addEventListener('click', ()=>signOut(auth));
  let unsubs = [];
  let signOutHandler = null;
  window.addEventListener('office-signout', ()=>{ if(signOutHandler) signOutHandler(); });
  startPreview();
  showGate('Sign in with your Google account to enter the office.');

  onAuthStateChanged(auth, async u=>{
    unsubs.forEach(f=>f()); unsubs = []; API = null;
    if(!u){ if(S.mode==='live'){ S.mode='loading'; startPreview(); } showGate('Sign in with your Google account to enter the office.'); return; }
    const key = emailKey(u.email);
    let allowed = false, admin = false;
    try{ allowed = (await get(ref(rdb,'allowed/'+key))).val()===true; }catch(e){ allowed = false; }
    if(!allowed){ showGate(`${u.email} isn’t on the office list yet. Ask an office admin to add it.`, true); return; }
    try{ admin = (await get(ref(rdb,'admins/'+key))).val()===true; }catch(e){ admin = false; }
    gate.el.hidden = true;

    const uid = u.uid;
    const name = u.displayName || u.email.split('@')[0];
    await set(ref(rdb,'profiles/'+uid), {name:name.slice(0,80), photo:u.photoURL||'', color:colorFor(uid)}).catch(()=>{});

    S.mode = 'live'; S.occ = {}; S.requests = {}; S.online = new Set([uid]); S.walkers = new Map(); S.grant = null; S.config = {};
    profilesCache = {}; feedList.textContent = '';
    S.me = {id:uid, name, avatar:u.photoURL||'', color:colorFor(uid), host:admin, canWrite:true};
    S.readOnly = false;

    const pref = ref(rdb,'presence/'+uid);
    let presenceState = {looking:S.selected};
    API = {
      ask: room => set(ref(rdb,'requests/'+uid), {room, at:Date.now()}),
      cancel: () => remove(ref(rdb,'requests/'+uid)),
      enter: room => update(ref(rdb), {['occupancy/'+uid]:{room, since:Date.now()}, ['requests/'+uid]:null}),
      leave: who => remove(ref(rdb,'occupancy/'+who)),
      decide: (who, grant) => update(ref(rdb), {['grants/'+who]:grant, ['requests/'+who]:null}),
      saveConfig: next => set(ref(rdb,'config/rooms'), next),
      saveNotes: (room, url) => url ? set(ref(rdb,'notes/'+room), {url, at:Date.now(), by:uid}) : remove(ref(rdb,'notes/'+room)),
      presence: patch => { presenceState = {...presenceState, ...patch}; update(pref, patch).catch(()=>{}); },
      invite: (to, room) => {
        const paths = {['invites/'+to+'/'+uid]:{room, at:Date.now()}};
        // a host's invite also lets the person straight in
        if(admin && meetFor(room)) paths['grants/'+to] = {room, meet:meetFor(room), decision:'approved', at:Date.now(), by:uid};
        return update(ref(rdb), paths);
      },
      dismissInvite: from => { delete INVITES[from]; renderInvites(); return remove(ref(rdb,'invites/'+uid+'/'+from)).catch(()=>{}); },
      chat: (thread, text) => {
        const msg = {from:uid, text, at:Date.now()};
        if(thread==='general') return set(push(ref(rdb,'chat/general')), msg);
        const other = thread.slice(3), tid = [uid, other].sort().join('_');
        const key = push(ref(rdb,'dm/'+tid)).key, last = {at:msg.at, from:uid, text:text.slice(0,80)};
        return update(ref(rdb), {['dm/'+tid+'/'+key]:msg, ['dmIndex/'+uid+'/'+other]:last, ['dmIndex/'+other+'/'+uid]:last});
      },
      watchDM: thread => {
        if(dmUnsub){ dmUnsub(); dmUnsub = null; }
        if(!thread.startsWith('dm:')) return;
        const other = thread.slice(3), tid = [uid, other].sort().join('_');
        dmUnsub = onValue(query(ref(rdb,'dm/'+tid), limitToLast(100)), s=>{
          const arr = []; s.forEach(c=>{ const v = c.val(); if(v && typeof v.text==='string') arr.push(v); });
          CHAT.dm[thread] = arr; renderThreads();
        }, ()=>{});
      },
    };
    let dmUnsub = null;
    unsubs.push(()=>{ if(dmUnsub) dmUnsub(); });
    CHAT.general = []; CHAT.dm = {}; CHAT.index = {}; CHAT.thread = 'general'; INVITES = {};
    try{ const sp = JSON.parse(localStorage.getItem('ihq-pos')||'null'); if(sp && isFinite(sp.x) && isFinite(sp.z) && !blocked(sp.x, sp.z)){ FP.x = sp.x; FP.z = sp.z; FP.yaw = sp.yaw||0; FP.free = true; presenceState.walk = {x:+sp.x.toFixed(2), z:+sp.z.toFixed(2), r:+((sp.yaw||0)+Math.PI).toFixed(2)}; } }catch(e){}
    unsubs.push(onValue(ref(rdb,'.info/connected'), s=>{
      if(s.val()!==true) return;
      onDisconnect(pref).remove().then(()=>set(pref, {...presenceState, walk:presenceState.walk||null, at:serverTimestamp()})).catch(()=>{});
    }));

    feed('You walked into the office.');
    let firstGen = true, prevIndex = {};
    unsubs.push(onValue(query(ref(rdb,'chat/general'), limitToLast(100)), s=>{
      const arr = []; s.forEach(c=>{ const v = c.val(); if(v && typeof v.text==='string') arr.push(v); });
      if(!firstGen){ const last = arr[arr.length-1]; if(last && last.from!==uid && !(CHAT.thread==='general' && chatVisible())) feed(`${(S.profiles[last.from]||{}).name||'Someone'} posted in General.`); }
      firstGen = false; CHAT.general = arr; renderThreads();
    }, ()=>{}));
    unsubs.push(onValue(ref(rdb,'dmIndex/'+uid), s=>{
      const idx = s.val() || {};
      Object.entries(idx).forEach(([o,v])=>{ const pv = prevIndex[o]; if(v && v.from!==uid && (!pv || pv.at!==v.at) && Object.keys(prevIndex).length+1 && !(CHAT.thread==='dm:'+o && chatVisible()) && Date.now()-v.at < 60000) toast(`${(S.profiles[o]||{}).name||'Someone'}: ${v.text}`); });
      prevIndex = idx; CHAT.index = idx; renderThreads();
    }, ()=>{}));
    unsubs.push(onValue(ref(rdb,'invites/'+uid), s=>{ INVITES = s.val() || {}; renderInvites(); }, ()=>{}));
    const nameOf = id => (S.profiles[id] && S.profiles[id].name) || 'Someone';
    let firstReq = true, firstOcc = true;

    unsubs.push(onValue(ref(rdb,'profiles'), s=>{ S.profiles = s.val() || {}; render(); }, ()=>{}));
    unsubs.push(onValue(ref(rdb,'requests'), s=>{
      const m = {}; Object.entries(s.val()||{}).forEach(([k,v])=>{ if(v && ROOMS[v.room]) m[k] = v; });
      if(!firstReq) diffKeys(S.requests, m).added.forEach(k=>{ feed(`${nameOf(k)} asked to join ${ROOMS[m[k].room].name}.`); if(S.me.host && k!==uid) toast(`${nameOf(k)} is waiting at ${ROOMS[m[k].room].name}`); });
      firstReq = false; S.requests = m; render();
    }, ()=>{ S.stale = true; render(); }));
    unsubs.push(onValue(ref(rdb,'occupancy'), s=>{
      const m = {}; Object.entries(s.val()||{}).forEach(([k,v])=>{ if(v && ROOMS[v.room]) m[k] = v; });
      if(!firstOcc){ const d = diffKeys(S.occ, m); d.added.forEach(k=>feed(`${nameOf(k)} joined ${ROOMS[m[k].room].name}.`)); d.removed.forEach(k=>feed(`${nameOf(k)} left ${ROOMS[S.occ[k].room].name}.`)); }
      firstOcc = false; S.occ = m; render();
    }, ()=>{ S.stale = true; render(); }));
    unsubs.push(onValue(ref(rdb,'grants/'+uid), s=>{
      const prev = S.grant; S.grant = s.val();
      if(S.grant && (!prev || prev.at!==S.grant.at) && ROOMS[S.grant.room] && (Date.now()-S.grant.at) < 10*60000){
        if(S.grant.decision==='approved'){ toast(`You’re in! Open ${ROOMS[S.grant.room].name}.`); feed(`A host let you into ${ROOMS[S.grant.room].name}.`); if(S.selected!==S.grant.room) select(S.grant.room,!FP.on); }
        else if(S.grant.decision==='declined') toast(`A host declined your request for ${ROOMS[S.grant.room].name}.`);
      }
      render();
    }, ()=>{}));
    unsubs.push(onValue(ref(rdb,'notes'), s=>{ S.notes = s.val() || {}; render(); }, ()=>{}));
    if(admin) unsubs.push(onValue(ref(rdb,'config/rooms'), s=>{ S.config = s.val() || {}; render(); }, ()=>{}));
    unsubs.push(onValue(ref(rdb,'presence'), s=>{
      const all = s.val() || {}, walkers = new Map();
      Object.entries(all).forEach(([k,v])=>{
        const w = v && v.walk;
        if(k!==uid && w && typeof w.x==='number' && typeof w.z==='number' && isFinite(w.x) && isFinite(w.z))
          walkers.set(k, {x:Math.max(-30,Math.min(32,w.x)), z:Math.max(-17,Math.min(17,w.z)), r:typeof w.r==='number'?w.r:0});
      });
      const next = new Set([uid, ...Object.keys(all)]);
      const same = next.size===S.online.size && [...next].every(x=>S.online.has(x));
      S.walkers = walkers;
      if(!same){ S.online = next; render(); return; }
      let resync = false;
      for(const [k,p] of people){ const w = walkers.get(k) || null; if(p.walk && !w){ p.walk = null; p.key = ''; resync = true; } else p.walk = w; }
      if(resync) syncScene(profilesCache);
    }, ()=>{}));
    signOutHandler = ()=>{ remove(pref).catch(()=>{}).finally(()=>signOut(auth)); };
    render();
  });
}
boot();
})();
</script>
